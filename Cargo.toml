[package]
name = "space_trader"
version = "0.1.0"
edition = "2021"
authors = ["Michael <michael@example.com>"]
description = "A Rust port of the classic Space Trader game for Palm OS"
license = "GPL-2.0-or-later"
repository = "https://github.com/yourusername/rusttrader"
keywords = ["game", "space", "trading", "elite"]
categories = ["games"]

[dependencies]
# Random number generation
rand = "0.8"

# Serialization for save/load
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Game engine (choose one - macroquad is simpler to start)
macroquad = "0.4"

# Optional: Terminal UI for early development
# crossterm = "0.27"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
